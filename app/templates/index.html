<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Santos | Agendamento Premium</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0f;
            --card-bg: #16161a;
            --input-bg: #1f1f24;
            --border-color: #2a2a32;
            --accent-gold: #c9a227;
            --accent-gold-hover: #e5b82e;
            --text-primary: #f3f3f6;
            --text-secondary: #9a9ab0;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --whatsapp-color: #25d366;
            --whatsapp-hover: #1ebd56;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(201, 162, 39, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 50% 100%, rgba(22, 22, 26, 0.5) 0%, transparent 50%);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            padding: 36px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 56px;
            height: 56px;
            margin: 0 auto 12px;
            background: rgba(201, 162, 39, 0.1);
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-gold);
        }

        .brand-logo svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.25s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15);
            background-color: #24242b;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-primary);
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--accent-gold), #b38d1d);
            border: none;
            border-radius: 10px;
            color: #0d0d0f;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(201, 162, 39, 0.25);
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, var(--accent-gold-hover), var(--accent-gold));
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 162, 39, 0.35);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        #mensagem {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            display: none;
        }

        #mensagem.sucesso {
            display: block;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.3);
            color: var(--success-color);
        }

        #mensagem.erro {
            display: block;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: var(--error-color);
        }

        .btn-whatsapp {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            background-color: var(--whatsapp-color);
            border-radius: 10px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }

        .footer-info {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M19.5,4.5L16.5,7.5L15,6L18,3L19.5,4.5M6.5,4.5L9.5,7.5L11,6L8,3L6.5,4.5M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/>
                </svg>
            </div>
            <h1>Barbearia Santos</h1>
            <p class="subtitle">Agende seu horário com nossos especialistas</p>
        </div>

        <form id="formAgendamento">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="telefone">WhatsApp / Celular</label>
                <input type="tel" id="telefone" required placeholder="(61) 99999-9999">
            </div>

            <div class="form-group">
                <label for="servico">Serviço Desejado</label>
                <select id="servico" required>
                    <option value="">Selecione um serviço...</option>
                    {% for s in servicos %}
                        <option value="{{ s.id }}" data-nome="{{ s.nome }}">{{ s.nome }} — R$ {{ "%.2f"|format(s.preco) }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="data_hora">Data e Horário</label>
                <input type="datetime-local" id="data_hora" required>
            </div>

            <button type="submit">Confirmar Agendamento</button>
        </form>
        
        <div id="mensagem"></div>
        <a id="btnWhatsapp" class="btn-whatsapp" target="_blank">
            <span>📲 Confirmar via WhatsApp</span>
        </a>

        <div class="footer-info">
            📍 Atendimento de Segunda a Sábado | 08h às 20h
        </div>
    </div>

    <script>
        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const servicoSelect = document.getElementById('servico');
            const servicoId = servicoSelect.value;
            const servicoNome = servicoSelect.options[servicoSelect.selectedIndex].getAttribute('data-nome');
            const dataHora = document.getElementById('data_hora').value;

            const payload = {
                nome: nome,
                telefone: telefone,
                servico_id: servicoId,
                data_hora: dataHora
            };

            const res = await fetch('/agendar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            const msgDiv = document.getElementById('mensagem');
            const btnWa = document.getElementById('btnWhatsapp');

            if (res.ok) {
                msgDiv.className = 'sucesso';
                msgDiv.innerText = data.mensagem;

                const dataObj = new Date(dataHora);
                const dataFormatada = dataObj.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

                const numeroBarbearia = '5561999999999';
                const texto = `Olá! Realizei um agendamento na Barbearia Santos.\n\n👤 *Cliente:* ${nome}\n✂️ *Serviço:* ${servicoNome}\n📅 *Data/Hora:* ${dataFormatada}`;
                
                btnWa.href = `https://wa.me/${numeroBarbearia}?text=${encodeURIComponent(texto)}`;
                btnWa.style.display = 'flex';

                document.getElementById('formAgendamento').reset();
            } else {
                msgDiv.className = 'erro';
                msgDiv.innerText = data.erro || 'Erro ao agendar.';
                btnWa.style.display = 'none';
            }
        });
    </script>
</body>
</html>
