<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbearia Santos</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 90vh; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 8px; width: 100%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #f39c12; margin-bottom: 20px; font-size: 22px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: 1px solid #333; box-sizing: border-box; }
        input { background: #2c2c2c; color: #fff; }
        button { background: #f39c12; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 20px; font-size: 16px; }
        button:hover { background: #d35400; }
        .erro { color: #e74c3c; margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Barbearia Santos - Admin</h1>
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <label for="usuario">Usuário:</label>
            <input type="text" id="usuario" name="usuario" required placeholder="Digite o usuário">

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required placeholder="Digite a senha">

            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
