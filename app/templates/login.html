<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin | Barbearia Santos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4 selection:bg-orange-500 selection:text-white">
  <div class="w-full max-w-sm space-y-6">
    <div class="flex flex-col items-center text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-orange-500 text-zinc-950 flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/20">
        ✂
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight">
        Barbearia <span class="text-orange-500">Santos</span>
      </h1>
      <p class="text-xs text-zinc-400">Acesso restrito ao painel administrativo</p>
    </div>

    <form method="POST" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-4 shadow-xl">
      {% with msgs = get_flashed_messages() %}
        {% if msgs %}
        <div class="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-400 text-center">
          {{ msgs[0] }}
        </div>
        {% endif %}
      {% endwith %}

      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1.5">Usuário</label>
        <input
          type="text"
          name="usuario"
          required
          autofocus
          placeholder="admin"
          class="w-full rounded-xl bg-zinc-950 border border-zinc-700 px-3.5 py-2.5 text-sm text-white outline-none focus:border-orange-500 transition"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-zinc-400 mb-1.5">Senha</label>
        <input
          type="password"
          name="senha"
          required
          placeholder="••••"
          class="w-full rounded-xl bg-zinc-950 border border-zinc-700 px-3.5 py-2.5 text-sm text-white outline-none focus:border-orange-500 transition"
        />
      </div>

      <button
        type="submit"
        class="w-full py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white font-bold text-sm transition shadow-lg shadow-orange-500/20"
      >
        Entrar no Painel
      </button>
    </form>

    <a href="{{ url_for('main.index') }}" class="block text-center text-xs text-zinc-500 hover:text-orange-400 transition">
      ← Voltar para a página de agendamento
    </a>
  </div>
</body>
</html>
