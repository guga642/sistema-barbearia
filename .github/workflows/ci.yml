name: CI - Pipeline Barbearia Santos

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-sqlalchemy pytest pytest-cov

      - name: Validar compilação e sintaxe (Build)
        run: python -m py_compile app.py app/models.py tests/test_app.py

      - name: Executar testes automatizados e Coverage
        run: pytest --cov --cov-report=term-missing -v